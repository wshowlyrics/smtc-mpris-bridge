[package]
name = "smtc-mpris-bridge-host"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Linux host side of smtc-mpris-bridge: republishes guest SMTC sessions as MPRIS players"

[dependencies]
protocol = { package = "smtc-mpris-bridge-protocol", path = "../protocol" }
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "time", "sync", "signal"] }
zbus = { version = "6.0.0", default-features = false, features = ["tokio", "service"] }
